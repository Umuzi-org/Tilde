<header class="{{styles.secondary_header_container}}">    
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <h1 class="{{ styles.heading1 }}">Project review coordination</h1>
    </div>
    <div class="hidden md:block flex-initial">
        <div class="ml-10 flex items-baseline space-x-4">
          {% with url_name=request.resolver_match.url_name %}
            <a href="{% url 'project_review_coordination_unclaimed' %}" class="{% if url_name == 'project_review_coordination_unclaimed' %} {{styles.secondary_header_nav_link_active}} {% else %} {{styles.secondary_header_nav_link}} {% endif %}">Unclaimed bundles</a>
            <a href="{% url 'project_review_coordination_my_claims' %}"  class="{% if url_name == 'project_review_coordination_my_claims' %} {{styles.secondary_header_nav_link_active}} {% else %} {{styles.secondary_header_nav_link}} {% endif %}">My claims</a>
            <a href="{% url 'project_review_coordination_all_claims' %}"  class="{% if url_name == 'project_review_coordination_all_claims' %} {{styles.secondary_header_nav_link_active}} {% else %} {{styles.secondary_header_nav_link}} {% endif %}">All claims</a>
          {% endwith %}  
        </div>
      </div>
      <div class="flex-grow"></div>
</header>
